name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p www assets && cp index.html www/index.html && cp icon.png assets/icon-only.png
      - run: npm install
      - run: npm install --save-dev @capacitor/assets
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#050805' --iconBackgroundColorDark '#050805'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: terminal01-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
