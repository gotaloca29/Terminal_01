          font-size:9px;

        .col-dur{font-size:10px; text-align:right; font-variant-numeric: tabular-nums; opacity:0.40; letter-spacing:0.02em; overflow:hidden; white-space:nowrap}
        .col-play{font-size:11px; text-align:center; opacity:0.35; line-height:1}
        .col-play.is-current{opacity:1; color:#00FF88}
        .playlist-table-wrap{display:flex; flex-direction:column; width:100%; min-width:0}
